name: Lighthouse

on:
  pull_request:
    branches: [main, develop]

jobs:
  lighthouse:
    name: lighthouse budgets
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build (supabase)
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_AI_ENABLED: 'false'

      - name: Lighthouse CI
        run: bunx @lhci/cli@0.14.x autorun

      - name: Format Lighthouse report
        if: ${{ !cancelled() }}
        run: bun scripts/format-lighthouse-comment.ts lighthouse-comment.md

      - name: Comment Lighthouse scores
        if: ${{ !cancelled() }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: lighthouse
          path: lighthouse-comment.md
          ignore_empty: true
          skip_unchanged: true
